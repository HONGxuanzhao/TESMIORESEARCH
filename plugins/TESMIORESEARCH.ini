; TESMIORESEARCH 0.3.1 | Original research controls | TESMIO API 4
; Speed multipliers: 0.05 .. 20. Global * branch * per-ID.
[research]
enabled=1
speed_multiplier=1.0

[technical]
speed_multiplier=1.0
[medical]
speed_multiplier=1.0
[soviet]
speed_multiplier=1.0

[effects]
; Remaining emission coefficient after original pollution-filter research: 0 .. 1.
pollution_filter_remaining=0.775
; Original timed policy LOCK_AFTER_DAYS multiplied by this value: 0.05 .. 20.
policy_duration_multiplier=1.0
; Residential research unlock thresholds: quality 0.1 .. 1; height 1 .. 500.
housing_quality_threshold=0.899999
housing_height_threshold=33.8

